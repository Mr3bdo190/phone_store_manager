name: phone_store_manager
description: Professional offline mobile phone store management application.
publish_to: 'none'
version: 1.0.0+1
environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # Database - Drift with SQLite
  drift: ^2.35.0
  sqlite3_flutter_libs: ^0.6.0+eo
  path_provider: ^2.1.6
  path: ^1.9.0
  # State management - lightweight
  provider: ^6.1.5+1
  # Utilities
  intl: ^0.20.3
  crypto: ^3.0.7
  # Encryption for PIN/password storage
  flutter_secure_storage: ^11.1.1
  # File operations for backup
  share_plus: ^13.3.0
  # CSV for import/export
  csv: ^8.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  test: ^1.25.8
  lints: ^4.0.0
  mocktail: ^1.0.4
  drift_dev: ^2.35.0
  build_runner: ^2.5.4

flutter:
  uses-material-design: true
  assets:
    - lib/l10n/
