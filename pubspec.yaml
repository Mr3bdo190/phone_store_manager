name: phone_store_manager
description: Professional offline mobile phone store management application.
publish_to: 'none'
version: 1.0.0+1
environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # Database - Drift with SQLite
  drift: ^2.60.0
  sqlite3_flutter_libs: ^0.6.5
  path_provider: ^2.13.0
  path: ^1.9.0
  # State management - lightweight
  provider: ^6.1.5
  # Utilities
  intl: ^0.19.0
  crypto: ^3.0.3
  # Encryption for PIN/password
  flutter_secure_storage: ^9.2.4
  # Local notifications
  flutter_local_notifications: ^17.0.0
  # File operations for backup
  share_plus: ^5.0.2
  file_picker: ^6.3.0
  # CSV for import/export
  csv: ^5.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  mocktail: ^1.0.4
  drift_dev: ^2.60.0
  build_runner: ^2.5.4

flutter:
  uses-material-design: true
  assets:
    - lib/l10n/
  generate: true

  fonts:
    - family: Cairo
      fonts:
        - asset: lib/core/theme/fonts/Cairo-Regular.ttf
        - asset: lib/core/theme/fonts/Cairo-Medium.ttf
        - asset: lib/core/theme/fonts/Cairo-Bold.ttf
        - asset: lib/core/theme/fonts/Cairo-SemiBold.ttf

  # Material 3 localization delegates
  # The actual arb files will be added in Phase 1
